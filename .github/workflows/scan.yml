name: Offscan scans your year

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install fonttools==4.68.0 brotli==1.2.1
      - name: Draw the scan from this year's contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/scan.py "$GITHUB_REPOSITORY_OWNER"
      - name: Commit if it changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/scan-dark.svg assets/scan-light.svg
          git diff --cached --quiet && exit 0
          git commit -m 'Daily scan'
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
